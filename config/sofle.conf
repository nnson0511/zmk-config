# Enable Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Enable EC11 Rotary Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display Battery Percentage on OLED Widget
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable Words-Per-Minute (WPM) Typing Speed Widget on OLED
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Fetch Peripheral (Right Half) Battery Level to Display on Central (Left Half) OLED
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable ZMK Studio Support & Disable Locking requirement
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
