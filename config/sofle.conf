# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Sofle"

# Disable OLED Display for maximum stability and battery life
CONFIG_ZMK_DISPLAY=n

# Enable EC11 Rotary Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable Deep Sleep (15 minutes)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Fix Windows BLE GATT battery polling disconnect loop
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

